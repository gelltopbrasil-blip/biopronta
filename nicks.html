<script>function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const pick=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n);
function show(id,arr){const o=document.getElementById(id);o.innerHTML=arr.map(t=>`<div class="item">${esc(t)}<button type="button">Copiar</button></div>`).join('');
o.querySelectorAll('button').forEach(c=>c.onclick=async()=>{try{await navigator.clipboard.writeText(c.parentElement.firstChild.textContent);c.textContent='Copiado!'}catch(e){c.textContent='Selecione e copie'}setTimeout(()=>c.textContent='Copiar',1500)})}
const v=id=>document.getElementById(id).value.trim();
const W=['Lobo','Sombra','Fênix','Rei','Ninja','Trovão','Alpha','Mestre','Fantasma','Dragão'];
document.getElementById('g').onclick=()=>{const n=(v('n')||pick(W,1)[0]).replace(/\s+/g,'');
const T=[`xX${n}Xx`,`${n}BR`,`Mr${n}`,`The${n}`,`${n}_Oficial`,`${n}Pro`,`Dark${n}`,`${n}777`,`ツ${n}ツ`,`☠${n}☠`,`${n}.exe`,`${n}_Gamer`,`Lil${n}`,`${n}Zika`,`${n}Real`,`${n}666`.replace('666','404')];
show('o',pick(T,8))};</script></body></html>
