<script>function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const pick=(a,n)=>[...a].sort(()=>Math.random()-.5).slice(0,n);
function show(id,arr){const o=document.getElementById(id);o.innerHTML=arr.map(t=>`<div class="item">${esc(t)}<button type="button">Copiar</button></div>`).join('');
o.querySelectorAll('button').forEach(c=>c.onclick=async()=>{try{await navigator.clipboard.writeText(c.parentElement.firstChild.textContent);c.textContent='Copiado!'}catch(e){c.textContent='Selecione e copie'}setTimeout(()=>c.textContent='Copiar',1500)})}
const v=id=>document.getElementById(id).value.trim();
document.getElementById('g').onclick=()=>{const s=+v('s'),l=+v('l')||0,c=+v('c')||0;const r=document.getElementById('r');
if(!s||s<1){r.textContent='Digite o número de seguidores.';return}
const e=(l+c)/s*100;const q=e<1?'baixo':e<3.5?'médio':e<6?'bom':'ótimo';
r.innerHTML=`<div class="big">${e.toFixed(2).replace('.',',')}%</div>Engajamento ${q}. Referência aproximada: abaixo de 1% é baixo, de 1% a 3,5% médio, de 3,5% a 6% bom e acima de 6% ótimo. Os valores variam por nicho e tamanho do perfil.`}</script></body></html>
